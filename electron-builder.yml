appId: com.adarkcave.game
productName: A Dark Cave
copyright: Copyright © A Dark Cave

directories:
  output: release
  buildResources: build-resources

# Files included in the packaged app. package.json and steamworks.js are shared.
# The SPA, Electron main, and steam_appid.txt are added per edition by
# scripts/package-steam-edition.mjs (dist/web-steam-*, dist/electron-steam-*).
# Those folders stay out of this list so one edition cannot delete files another
# electron-builder is still packing.
files:
  - package.json
  - node_modules/steamworks.js/**/*

# Native modules and Steam redistributable binaries must NOT be packed into the
# asar archive (they are loaded by the OS / native loader).
asar: true
asarUnpack:
  - "**/*.node"
  - node_modules/steamworks.js/**/*

win:
  target:
    - nsis
  icon: build-resources/icon.png
  artifactName: ${productName}-${version}-setup.${ext}

# Native Linux build. Opt-in: the Windows flow above is unchanged.
#   npm run electron:package:linux        -> release/linux-unpacked
#   npm run electron:package:demo:linux
# `dir` is a plain folder for a SteamPipe Linux depot. AppImage needs FUSE and
# does not fit the Steam Linux Runtime container. Steamworks setup (depot,
# launch options, Cloud root override): steam/linux-build.md
linux:
  target:
    - dir
  # Same name for the full game and the demo, so one Steam launch option fits both.
  executableName: a-dark-cave
  icon: build-resources/icon.png
  category: Game
  # Electron cannot load .ico on Linux; main.ts uses this PNG there.
  extraResources:
    - from: build-resources/icon.png
      to: icon.png

extraResources:
  - from: build-resources/icon.ico
    to: icon.ico

# Deck layout, next to the exe (outside asar). Same files ship in the full
# game and the demo. Steamworks, each app: Steam Input → Custom Configuration
# (Bundled with game) → steam_input/steam_input_manifest.vdf
extraFiles:
  - from: steam/input
    to: steam_input
    filter:
      - "**/*"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Steam handles distribution/updates; disable electron auto-update publishing.
publish: null
