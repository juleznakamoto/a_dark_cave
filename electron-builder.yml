appId: com.adarkcave.game
productName: A Dark Cave
copyright: Copyright © A Dark Cave

directories:
  output: release
  buildResources: build-resources

# Files included in the packaged app. package.json and steamworks.js are shared.
# The SPA, Electron main, and steam_appid.txt are added per edition by
# scripts/package-steam-edition.mjs (dist/web-steam-*, dist/electron-steam-*).
# Those folders stay out of this list so one edition cannot delete files another
# electron-builder is still packing.
files:
  - package.json
  - node_modules/steamworks.js/**/*

# Native modules and Steam redistributable binaries must NOT be packed into the
# asar archive (they are loaded by the OS / native loader).
asar: true
asarUnpack:
  - "**/*.node"
  - node_modules/steamworks.js/**/*

win:
  target:
    - nsis
  icon: build-resources/icon.png
  artifactName: ${productName}-${version}-setup.${ext}

extraResources:
  - from: build-resources/icon.ico
    to: icon.ico

# Deck layout, next to the exe (outside asar). Same files ship in the full
# game and the demo. Steamworks, each app: Steam Input → Custom Configuration
# (Bundled with game) → steam_input/steam_input_manifest.vdf
extraFiles:
  - from: steam/input
    to: steam_input
    filter:
      - "**/*"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Steam handles distribution/updates; disable electron auto-update publishing.
publish: null
